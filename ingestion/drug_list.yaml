# Drug list for the ingestion pipeline.
#
# Source: curated from ClinCalc Top 200 (recurring entries across 2021-2023
# publications) plus high-yield additions (DOACs, GLP-1s, SGLT2s, contraceptives,
# common psych meds). Compiled without live-scraping (WebFetch was unavailable
# for clincalc.com at the time), so the order is by clinical grouping rather
# than prescription rank.
#
# Conventions:
#   - lowercase ASCII only
#   - generic names (no brands)
#   - combinations use hyphens between components, alphabetical-ish
#   - one drug per list entry; deduped
#
# Edit freely: re-run `python -m ingestion fetch` after changes.
